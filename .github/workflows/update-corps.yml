name: Update corp list

on:
  schedule:
    - cron: "0 0 1 * *" # 매월 1일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download listed companies (+ industry codes)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/update_corps.py --with-industry
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corps.json
          git diff --cached --quiet || git commit -m "chore: update corp list"
          git push
