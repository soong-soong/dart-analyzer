<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DART 재무 비교</title>
  <meta name="description" content="DART Open API로 상장사 재무제표를 불러와 재무비율과 추이를 비교합니다." />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <h1>DART 재무 비교</h1>
      <p class="sub">상장사 사업보고서 기준 · 최대 4개 기업 비교</p>
    </div>
  </header>

  <main class="wrap">
    <section class="controls card">
      <div class="search">
        <label for="q">기업 추가</label>
        <input id="q" type="search" placeholder="기업명 또는 종목코드 (예: 삼성전자, 005930)" autocomplete="off" />
        <ul id="suggest" class="suggest" role="listbox" hidden></ul>
      </div>
      <div class="opts">
        <label>재무제표
          <select id="fs">
            <option value="CFS">연결</option>
            <option value="OFS">별도</option>
          </select>
        </label>
        <label>기준 사업연도
          <select id="year"></select>
        </label>
      </div>
      <div id="chips" class="chips"></div>
      <p id="corpsInfo" class="muted small"></p>
    </section>

    <p id="empty" class="empty" hidden>위 검색창에서 비교할 기업을 추가하세요.</p>

    <section id="results" hidden>
      <h2>기업 개요 · 업종</h2>
      <div id="profiles" class="profiles"></div>

      <h2>재무비율 비교 <span class="muted small" id="ratioYear"></span></h2>
      <div class="card table-wrap"><table id="ratioTable" class="tbl"></table></div>

      <div class="grid2">
        <div class="card">
          <div class="chart-head">
            <h3>재무 추이</h3>
            <select id="metric">
              <option value="revenue">매출액</option>
              <option value="operatingIncome">영업이익</option>
              <option value="netIncome">당기순이익</option>
              <option value="totalAssets">자산총계</option>
              <option value="totalLiabilities">부채총계</option>
              <option value="totalEquity">자본총계</option>
              <option value="operatingCashFlow">영업활동현금흐름</option>
            </select>
          </div>
          <div class="chart-box"><canvas id="trendChart"></canvas></div>
        </div>
        <div class="card">
          <div class="chart-head">
            <h3>비율 추이</h3>
            <select id="ratioSel"></select>
          </div>
          <div class="chart-box"><canvas id="ratioChart"></canvas></div>
        </div>
      </div>

      <h2>요약 재무제표
        <select id="focus" class="inline-select"></select>
      </h2>
      <div class="card table-wrap"><table id="stmtTable" class="tbl"></table></div>
    </section>
  </main>

  <footer class="wrap foot muted small">
    데이터: <a href="https://opendart.fss.or.kr" target="_blank" rel="noopener">금융감독원 DART Open API</a> ·
    투자 판단의 근거로 사용하지 마세요. 금융업(은행·보험 등)은 계정 구조가 달라 일부 비율이 표시되지 않습니다.
  </footer>
</body>
</html>
